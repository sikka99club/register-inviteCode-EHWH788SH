<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Support - Sikka 99</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bg-custom-green { background: linear-gradient(135deg, #00b074 0%, #00da83 100%); }
    </style>
</head>
<body class="bg-[#f7f8fa] min-h-screen flex flex-col justify-between text-gray-800">

    <!-- Top Header Bar -->
    <div class="bg-custom-green px-4 py-3.5 flex items-center justify-between shadow-md sticky top-0 z-50">
        <a href="profile.html" class="text-white hover:text-gray-100 transition p-1">
            <i class="fa-solid fa-chevron-left text-base"></i>
        </a>
        <h1 class="text-base font-bold text-white absolute left-1/2 -translate-x-1/2">Customer Support</h1>
        <div class="flex items-center space-x-1 bg-white/20 px-2.5 py-1 rounded-full text-white text-[10px] font-semibold">
            <span class="w-2 h-2 rounded-full bg-green-300 animate-pulse"></span>
            <span>Online</span>
        </div>
    </div>

    <!-- Chat Messages Container -->
    <div id="chatContainer" class="flex-1 px-4 py-4 space-y-3 overflow-y-auto max-h-[calc(100vh-140px)]">
        <!-- Welcome message will be loaded via script -->
    </div>

    <!-- Message Input Bar -->
    <div class="bg-white border-t border-gray-200 p-3 sticky bottom-0 z-40 flex items-center space-x-2 shadow-lg">
        <input type="text" id="messageInput" placeholder="Type your message here..." class="flex-1 bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-xs font-medium outline-none focus:border-emerald-500 transition">
        <button type="button" onclick="sendMessage()" class="bg-custom-green text-white w-11 h-11 rounded-xl shadow-md flex items-center justify-center hover:opacity-95 transition shrink-0">
            <i class="fa-solid fa-paper-plane text-xs"></i>
        </button>
    </div>

    <!-- Firebase & Advanced Auto-Reply Script Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBz-SPwj65Eg9XCIVBLxHu1G_c0YYkI_vY",
          authDomain: "sikka99-fb62e.firebaseapp.com",
          projectId: "sikka99-fb62e",
          storageBucket: "sikka99-fb62e.firebasestorage.app",
          messagingSenderId: "1050632951434",
          appId: "1:1050632951434:web:03b6788ef5416f873d3f73",
          measurementId: "G-1YK1QH5WHV"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Generate a new Unique Session ID every time the page loads 
        // This ensures the chat is always "cleared" when the user goes back and comes back again.
        const userId = "session_" + Date.now() + "_" + Math.random().toString(36).substring(2, 9); 
        
        const chatContainer = document.getElementById('chatContainer');

        const q = query(collection(db, "chats", userId, "messages"), orderBy("createdAt", "asc"));
        
        onSnapshot(q, (snapshot) => {
            // Default Welcome Message
            let htmlContent = `
                <div class="flex items-start space-x-2">
                    <div class="w-8 h-8 rounded-full bg-emerald-500 text-white flex items-center justify-center font-bold text-xs shrink-0 shadow-sm">
                        <i class="fa-solid fa-headset"></i>
                    </div>
                    <div class="bg-white rounded-2xl rounded-tl-sm p-3.5 shadow-sm max-w-[80%] border border-gray-100 text-xs leading-relaxed">
                        <p class="font-bold text-emerald-600 mb-1">Sikka 99 Support</p>
                        Hello! Welcome to Sikka 99 support. How can we help you today?
                    </div>
                </div>
            `;

            snapshot.forEach((doc) => {
                const data = doc.data();
                if (data.sender === 'user') {
                    htmlContent += `
                        <div class="flex items-end justify-end space-x-2 mt-3">
                            <div class="bg-emerald-600 text-white rounded-2xl rounded-tr-sm p-3.5 shadow-sm max-w-[80%] text-xs leading-relaxed">
                                ${escapeHtml(data.text)}
                            </div>
                        </div>
                    `;
                } else {
                    htmlContent += `
                        <div class="flex items-start space-x-2 mt-3">
                            <div class="w-8 h-8 rounded-full bg-emerald-500 text-white flex items-center justify-center font-bold text-xs shrink-0 shadow-sm">
                                <i class="fa-solid fa-headset"></i>
                            </div>
                            <div class="bg-white rounded-2xl rounded-tl-sm p-3.5 shadow-sm max-w-[80%] border border-gray-100 text-xs leading-relaxed">
                                <p class="font-bold text-emerald-600 mb-1">Admin Support</p>
                                ${escapeHtml(data.text)}
                            </div>
                        </div>
                    `;
                }
            });

            chatContainer.innerHTML = htmlContent;
            chatContainer.scrollTop = chatContainer.scrollHeight; // Auto-scroll to bottom
        });

        window.sendMessage = async function() {
            const inputEl = document.getElementById('messageInput');
            const text = inputEl.value.trim();
            if (!text) return;

            try {
                inputEl.value = '';
                
                // Save user message to database
                await addDoc(collection(db, "chats", userId, "messages"), {
                    sender: "user",
                    text: text,
                    createdAt: serverTimestamp()
                });

                // Advanced Smart Command & Auto-Reply Trigger
                setTimeout(async () => {
                    let replyText = "Thank you for contacting Sikka 99 support. Our agent will review your query shortly.";
                    const lowerText = text.toLowerCase();

                    if (lowerText.includes('hi') || lowerText.includes('hello') || lowerText.includes('hey')) {
                        replyText = "Hello! How can I help you today?";
                    } else if (lowerText.includes('withdraw') || lowerText.includes('withdrawal')) {
                        replyText = "Minimum ₹200 deposit need to withdraw.";
                    } else if (lowerText.includes('not received') || lowerText.includes('deposit not') || lowerText.includes('balance not') || lowerText.includes('add money')) {
                        replyText = "If your deposit amount is not received, please share your correct 12-digit UTR/Reference number and payment screenshot so we can verify and update it instantly.";
                    }

                    await addDoc(collection(db, "chats", userId, "messages"), {
                        sender: "admin",
                        text: replyText,
                        createdAt: serverTimestamp()
                    });
                }, 1000);

            } catch (error) {
                alert("Error sending message: " + error.message);
            }
        };

        // Add Enter key support for sending message
        document.getElementById('messageInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
