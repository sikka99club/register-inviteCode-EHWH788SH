<!DOCTYPE html>

    <!-- Today's Bonus & Total Bonus Card -->
    <div class="px-4 -mt-5 relative z-10">
        <div class="bg-emerald-500 rounded-2xl shadow-lg p-5 text-white flex flex-col items-center border border-emerald-400">

                <div class="w-1/2 border-r border-emerald-400/60">

                <div class="w-1/2">
                    <span class="text-xs text-emerald-100 block font-medium">Total bonus</span>

            </div>
            <button class="bg-white text-emerald-600 font-bold text-xs px-8 py-2.5 rounded-full shadow-md hover:bg-emerald-50 transition">

    </div>

    <!-- Top Feature Banners Section (Gifts & Attendance Bonus Grid) -->
    <div class="px-4 mt-5 grid grid-cols-2 gap-4">

            </div>
        </a>

        <!-- Attendance Bonus Banner Card (Redirects to attendance.html) -->
        <a href="attendance.html" class="bg-white rounded-2xl overflow-hidden shadow-md border border-gray-100 cursor-pointer hover:scale-[1.01] transition flex flex-col justify-between text-decoration-none">
            <div>

    <div class="px-4 mt-5 mb-6">
        <div class="w-full rounded-2xl overflow-hidden shadow-md relative">
            <img src="https://raw.githubusercontent.com/casinolootprmo/literate-doodle/1090b278f93d7ebd9e30d1fd799d08649e6346a3/file_00000000a5ec821196751b79cabe6822.png" alt="Poster" class="w-full h-44 object-cover">

        <!-- Home -->
        <a href="dashboard.html" class="flex flex-col items-center text-gray-400 hover:text-emerald-600 transition">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] font-semibold mt-1">Home</span>
        </a>
        <!-- Activity -->
        <a href="activity.html" class="flex flex-col items-center text-emerald-600">

        <!-- Withdraw -->
        <a href="withdraw.html" class="flex flex-col items-center text-gray-400 hover:text-emerald-600 transition">
            <i class="fa-solid fa-arrow-up-from-bracket text-lg"></i>
            <span class="text-[10px] font-semibold mt-1">Withdraw</span>
        </a>
        <!-- Profile -->
        <a href="profile.html" class="flex flex-col items-center text-gray-400 hover:text-emerald-600 transition">
            <i class="fa-solid fa-user text-lg"></i>
            <span class="text-[10px] font-semibold mt-1">Profile</span>
