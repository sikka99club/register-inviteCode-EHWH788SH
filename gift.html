<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sikka 99 - Gift Redemption</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bg-custom-green { background: linear-gradient(135deg, #00b074 0%, #00da83 100%); }
        @keyframes popUp {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popUp 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-12">

    <!-- Top Header Bar -->
    <div class="bg-white px-4 py-3.5 flex items-center shadow-sm relative sticky top-0 z-50">
        <a href="activity.html" class="text-gray-700 hover:text-emerald-600 transition">
            <i class="fa-solid fa-chevron-left text-lg"></i>
        </a>
        <h1 class="absolute left-1/2 -translate-x-1/2 text-base font-bold text-gray-800">Gift</h1>
    </div>

    <!-- Top Banner Image -->
    <div class="w-full bg-[#fcecd5] overflow-hidden">
        <img src="https://github.com/casinolootprmo/fuzzy-octo-umbrella/blob/8b6d8caae2f737fbaac0d2cc6f7d64ea8e7a8bc9/gift-D229Mngm.png?raw=true" alt="Gift Banner" class="w-full h-44 object-cover">
    </div>

    <!-- Main Container Card -->
    <div class="px-4 -mt-4 relative z-10 space-y-4">
        
        <!-- Gift Code Input Section -->
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
            <div class="mb-4">
                <p class="text-xs text-gray-400 font-medium">Hi</p>
                <h2 class="text-sm font-semibold text-gray-700 mt-0.5">We have a gift for you</h2>
            </div>

            <div class="mb-4">
                <label class="block text-xs text-gray-500 font-medium mb-2">Please enter the gift code below</label>
                <input type="text" id="giftCodeInput" placeholder="Please enter gift code" class="w-full px-4 py-3.5 bg-gray-50 border border-gray-100 rounded-2xl text-xs text-gray-700 placeholder-gray-300 focus:outline-none focus:bg-white focus:border-emerald-500 transition">
            </div>

            <button onclick="claimGift()" class="w-full py-3.5 bg-custom-green text-white font-bold text-sm rounded-full shadow-md hover:opacity-95 transition">
                Receive
            </button>
        </div>

        <!-- History Section -->
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
            <div class="flex items-center gap-2 mb-6">
                <span class="w-6 h-6 rounded-lg bg-emerald-500 flex items-center justify-center text-white text-xs shadow-sm">
                    <i class="fa-solid fa-calendar-days"></i>
                </span>
                <h3 class="text-sm font-bold text-gray-800">History</h3>
            </div>

            <!-- Empty Data State Graphic & Text -->
            <div class="flex flex-col items-center justify-center py-8">
                <div class="w-40 h-28 mb-3 opacity-60 flex items-center justify-center">
                    <svg viewBox="0 0 200 140" class="w-full h-full fill-current text-gray-200">
                        <path d="M40 100 Q 70 80, 100 100 T 160 90 L 160 120 L 40 120 Z" fill="#e5e7eb" />
                        <rect x="70" y="40" width="60" height="75" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
                        <rect x="85" y="55" width="30" height="4" rx="2" fill="#d1d5db"/>
                        <rect x="85" y="65" width="20" height="4" rx="2" fill="#d1d5db"/>
                        <circle cx="50" cy="95" r="8" fill="#d1d5db"/>
                        <circle cx="150" cy="90" r="6" fill="#d1d5db"/>
                    </svg>
                </div>
                <p class="text-xs text-gray-400 font-medium">No data</p>
            </div>
        </div>

    </div>

    <!-- Animated Custom Pop-up Modal -->
    <div id="customAlertModal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-[100] px-6 transition-opacity duration-300">
        <div id="modalBox" class="bg-white rounded-2xl w-full max-w-xs overflow-hidden shadow-2xl text-center animate-pop">
            <!-- Message Content -->
            <div class="py-7 px-4">
                <p id="alertMessageText" class="text-gray-700 text-base font-semibold">Worng Code</p>
            </div>
            <!-- Confirm Button -->
            <button onclick="closeAlertModal()" class="w-full py-3.5 bg-[#00b074] text-white font-bold text-base hover:bg-emerald-600 transition">
                Confirm
            </button>
        </div>
    </div>

    <!-- Firebase SDK & Database Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBz-SPwj65Eg9XCIVBLxHu1G_c0YYkI_vY",
          authDomain: "sikka99-fb62e.firebaseapp.com",
          projectId: "sikka99-fb62e",
          storageBucket: "sikka99-fb62e.firebasestorage.app",
          messagingSenderId: "1050632951434",
          appId: "1:1050632951434:web:03b6788ef5416f873d3f73",
          measurementId: "G-1YK1QH5WHV"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.showAlertModal = function(message) {
            document.getElementById('alertMessageText').innerText = message;
            document.getElementById('customAlertModal').classList.remove('hidden');
        }

        window.closeAlertModal = function() {
            document.getElementById('customAlertModal').classList.add('hidden');
        }

        window.claimGift = async function() {
            const code = document.getElementById('giftCodeInput').value.trim();
            if (!code) {
                showAlertModal('Please enter a valid gift code.');
                return;
            }

            try {
                const q = query(collection(db, "gift_codes"), where("code", "==", code));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    showAlertModal('Worng Code');
                } else {
                    showAlertModal('Success! Bonus claimed.');
                    document.getElementById('giftCodeInput').value = '';
                }
            } catch (error) {
                console.error("Error checking gift code: ", error);
                showAlertModal('Worng Code');
            }
        }
    </script>
</body>
</html>
